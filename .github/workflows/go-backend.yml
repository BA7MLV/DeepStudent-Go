name: Verify Go backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/go-backend-runtime
      - goal/go-runtime-foundation
  pull_request:
    branches:
      - main
      - feature/go-backend-runtime
      - goal/go-runtime-foundation

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "$files" ]]; then
            echo "Go files are not gofmt-formatted:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Contract tests (HTTP/SSE, replay, attachments, persistence)
        run: go test -count=1 ./internal/api ./internal/attachments ./internal/storage
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: CGO_ENABLED=0 go build ./cmd/server
