name: Verify Go backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/go-backend-runtime
      - goal/go-runtime-foundation
      - integration/agent-loop
      - feature/agent-loop-config-closure

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Normalize Go formatting
        run: gofmt -w cmd internal
      - name: Contract tests (HTTP/SSE, replay, attachments, persistence)
        run: go test -count=1 ./internal/api ./internal/attachments ./internal/storage
      - name: Test
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee go-test.log
      - name: Upload Go test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log
          path: go-test.log
          if-no-files-found: ignore
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: CGO_ENABLED=0 go build ./cmd/server
      - name: Test Pi sidecar
        run: |
          npm install --prefix packages/agent-sidecar --no-audit --no-fund
          npm test --prefix packages/agent-sidecar
