name: Verify Go backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/go-backend-runtime
  pull_request:
    branches:
      - main
      - feature/go-backend-runtime

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Format check
        run: gofmt -w cmd internal && test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: CGO_ENABLED=0 go build ./cmd/server
