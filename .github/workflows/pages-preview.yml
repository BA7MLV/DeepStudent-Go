name: Preview frontend on GitHub Pages

on:
  push:
    branches:
      - migration/mygo-shell-poc
      - integration/agent-loop
      - feature/agent-loop-config-closure
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run contract:test
      - run: VITE_DEPLOY_TARGET=pages npm run build --workspace frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    # The agent-loop config closure branch is intentionally publishable so the
    # public Pages preview reflects the same frontend under review.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/migration/mygo-shell-poc' || github.ref == 'refs/heads/integration/agent-loop' || github.ref == 'refs/heads/feature/agent-loop-config-closure')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
