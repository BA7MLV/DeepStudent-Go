<!doctype html>
<html lang="zh-CN" data-wangke="1">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：Android Chrome 键盘弹出时收缩 layout 视口，
         iOS 侧由 useMobileGlobals 的 --vvh 方案兜底 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 启动兜底；运行时由页面实际边缘色同步，不能用强调蓝代替画布色。 -->
    <meta name="theme-color" content="#f0f0f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepStudent Go" />
    <meta name="description" content="导入课程视频与文档，转写字幕、整理讲义，结合原文提问和复习。" />
    <link rel="icon" href="/icon.svg?v=deepstudent-75" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=deepstudent" />
    <title>DeepStudent Go</title>
  </head>
  <body>
    <!-- 首帧启动骨架：JS 就绪前由浏览器直接绘制，避免弱网下白屏。视觉与
         ui/page-loader.tsx 的扫光 logo 一致（同一组 SVG 路径 + shimmer 动画）；
         React createRoot().render() 首次渲染时会整体替换掉这段内容。 -->
    <div id="root">
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: #f8f8f8;
        }
        #boot-splash svg {
          display: block;
          width: clamp(36px, 5vw, 48px);
          height: auto;
        }
        #boot-splash .boot-base { fill: #2b2b2e; }
        #boot-splash .boot-shine {
          transform: translateX(-75%);
          transform-box: fill-box;
          transform-origin: center;
          animation: boot-shimmer 2000ms linear infinite;
          will-change: transform;
        }
        @keyframes boot-shimmer {
          0% { transform: translateX(-75%); }
          100% { transform: translateX(0); }
        }
        @media (prefers-color-scheme: dark) {
          #boot-splash { background: #101012; }
          #boot-splash .boot-base { fill: #f2f2f2; }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .boot-shine { animation: none; opacity: 0; }
        }
      </style>
      <div id="boot-splash" role="status" aria-label="正在启动…">
        <svg viewBox="182 192 650 650" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="boot-gradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0.4" stop-color="#f2f2f2" stop-opacity="0" />
              <stop offset="0.5" stop-color="#f2f2f2" />
              <stop offset="0.6" stop-color="#f2f2f2" stop-opacity="0" />
            </linearGradient>
            <mask id="boot-mask" maskUnits="userSpaceOnUse" x="182" y="192" width="650" height="650">
              <path d="M182 324.8C182 278.316 182 255.073 191.046 237.319C199.004 221.701 211.701 209.004 227.319 201.046C245.073 192 268.316 192 314.8 192H692.2C738.684 192 761.927 192 779.681 201.046C795.299 209.004 807.996 221.701 815.954 237.319C825 255.073 825 278.316 825 324.8V394C825 550.815 825 629.222 794.482 689.117C767.637 741.803 724.803 784.637 672.117 811.482C612.222 842 533.815 842 377 842H314.8C268.316 842 245.073 842 227.319 832.954C211.701 824.996 199.004 812.299 191.046 796.681C182 778.927 182 755.684 182 709.7V324.8Z" fill="white" />
              <path d="M238 349.56C238 315.061 238 297.811 244.714 284.634C250.62 273.043 260.043 263.62 271.634 257.714C284.811 251 302.061 251 336.56 251H671.44C705.939 251 723.189 251 736.366 257.714C747.957 263.62 757.38 273.043 763.286 284.634C770 297.811 770 315.061 770 349.56V379.8C770 520.933 770 591.5 742.534 645.406C718.374 692.822 679.822 731.374 632.406 755.534C578.5 783 507.933 783 366.44 783H336.56C302.061 783 284.811 783 271.634 776.286C260.62 770.057 250.62 760.957 244.714 749.286C238 736.189 238 718.939 238 684.44V349.56Z" fill="black" />
              <path d="M288.417 459.122C288.417 457.652 288.417 456.917 288.43 456.296C289.097 423.169 315.792 396.474 348.919 395.807C349.54 395.794 350.275 395.794 351.745 395.794H456.812C549.815 395.794 625.208 471.187 625.208 564.189C625.208 657.191 549.815 732.585 456.812 732.585H351.745C350.275 732.585 349.54 732.584 348.919 732.572C315.792 731.905 289.097 705.208 288.43 672.083C288.417 671.461 288.417 670.726 288.417 669.256V459.122Z" fill="white" />
              <path d="M735.686 358.247C735.686 394.974 705.673 424.747 668.65 424.747C631.627 424.747 601.614 394.974 601.614 358.247C601.614 321.27 631.627 291.747 668.65 291.747C705.673 291.747 735.686 321.27 735.686 358.247Z" fill="white" />
              <path d="M726.807 358.357C726.807 372.414 715.34 383.757 701.203 383.757C687.062 383.757 675.6 372.414 675.6 358.357C675.6 344.336 687.062 332.961 701.203 332.961C715.34 332.961 726.807 344.336 726.807 358.357Z" fill="black" />
            </mask>
          </defs>
          <g mask="url(#boot-mask)">
            <rect class="boot-base" x="182" y="192" width="650" height="650" />
            <rect class="boot-shine" x="182" y="192" width="2600" height="650" fill="url(#boot-gradient)" />
          </g>
        </svg>
      </div>
    </div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
