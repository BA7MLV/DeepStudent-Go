<div class="timer"><p id="status" class="muted"></p><output id="clock">25:00</output></div>
<div class="row"><label id="duration-label" for="duration"></label><input id="duration" type="number" min="1" max="180" value="25"></div>
<div class="row"><button id="start"></button><button id="reset"></button></div><p class="error" id="error" role="alert"></p>
<script>
let snapshot, busy = false;
const error = document.getElementById('error'), duration = document.getElementById('duration');
document.getElementById('duration-label').textContent = board.t('分钟', 'Minutes');
document.getElementById('reset').textContent = board.t('重置', 'Reset');
const left = () => snapshot?.data.endsAt ? Math.max(0, Math.ceil((snapshot.data.endsAt - Date.now()) / 1000)) : snapshot?.data.remainingSeconds ?? 1500;
function render() {
  const seconds = left(), running = snapshot?.data.endsAt && seconds > 0;
  document.getElementById('clock').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  document.getElementById('start').textContent = running ? board.t('暂停', 'Pause') : board.t('开始专注', 'Start focus');
  document.getElementById('status').textContent = seconds === 0 ? board.t('本轮完成，休息一下。', 'Session complete. Take a break.') : running ? board.t('专注中', 'Focusing') : board.t('准备好了吗？', 'Ready when you are');
}
async function load() { if (busy) return; try { snapshot = await board.read(); if (document.activeElement !== duration) duration.value = String(Math.round(snapshot.data.durationSeconds / 60)); render(); } catch (e) { error.textContent = e.message; } }
async function save(data) {
  if (busy || !snapshot) return;
  busy = true;
  try { snapshot = await board.write(data, snapshot); error.textContent = ''; render(); } catch (e) { error.textContent = e.message; }
  finally { busy = false; await load(); }
}
document.getElementById('start').onclick = () => {
  if (!snapshot) return;
  const seconds = left(), running = snapshot.data.endsAt && seconds > 0;
  const remaining = seconds || snapshot.data.durationSeconds;
  save({...snapshot.data, remainingSeconds: remaining, endsAt: running ? null : Date.now() + remaining * 1000});
};
document.getElementById('reset').onclick = () => {
  const seconds = Number(duration.value) * 60;
  if (!Number.isInteger(seconds) || seconds < 60 || seconds > 10800) return;
  save({durationSeconds: seconds, remainingSeconds: seconds, endsAt: null});
};
load(); setInterval(render, 250); setInterval(load, 5000);
</script>
<style>.timer{text-align:center;padding:8px}.timer output{display:block;font-size:3.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.row{justify-content:center;margin-top:14px}#duration{max-width:100px}</style>
