<p id="error" class="error" role="alert" hidden></p>
<div class="row task-toolbar"><button id="active"></button><button id="recent"></button><select id="scope"></select></div>
<div id="list" aria-live="polite"></div>
<script>
const list = document.getElementById('list'), error = document.getElementById('error');
let tasks = [], history = false, busy = false;
const expanded = new Set();
const active = task => !['completed','failed','cancelled','interrupted'].includes(task.status);
const text = (key, fallback) => board.labels[key] || fallback;
const title = task => task.kind === 'bot' ? task.title || text('botTask', 'Bot task') : (board.labels.kinds[task.kind] || text('task', 'Task')) + (task.resourceName ? ' · ' + task.resourceName : '');
const scope = document.getElementById('scope'); scope.setAttribute('aria-label', text('filter', 'Task source'));
for (const [value,label] of [['all',text('allTasks','All tasks')],['bot',text('botTasks','Bot tasks')],['app',text('appTasks','App tasks')]]) { const option=document.createElement('option');option.value=value;option.textContent=label;scope.append(option); }
function render() {
  const filtered = tasks.filter(task => scope.value === 'all' || (scope.value === 'bot' ? task.source?.kind === 'bot' : task.source?.kind !== 'bot'));
  document.getElementById('active').textContent = text('active', 'Active') + ' · ' + filtered.filter(active).length;
  document.getElementById('recent').textContent = text('recent', 'Recent') + ' · ' + filtered.filter(t => !active(t)).length;
  document.getElementById('active').setAttribute('aria-pressed', String(!history));
  document.getElementById('recent').setAttribute('aria-pressed', String(history));
  list.replaceChildren();
  const rows = filtered.filter(t => history ? !active(t) : active(t));
  if (!rows.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = text(history ? 'noHistory' : 'empty', 'No tasks'); list.append(p); }
  for (const task of rows) {
    const row = document.createElement('article'); row.className = 'task'; row.dataset.testid = 'background-task-' + task.id;
    const heading = document.createElement('strong'); heading.textContent = title(task);
    const detail = document.createElement('p'); detail.className = 'muted';
    const source = task.source?.kind === 'bot' ? task.source.name ? text('fromNamedBot', '{{name}} Bot').replace('{{name}}', task.source.name) : text('fromBot', 'Bot') : text('fromApp', 'App');
    detail.textContent = (board.labels.status[task.status] || task.status) + ' · ' + source;
    if (task.kind === 'bot' && task.resourceName) detail.textContent += ' · ' + task.resourceName;
    row.append(heading, detail);
    if (task.kind === 'bot' && (task.stepCount || task.progress?.tool)) {
      const p=document.createElement('p');p.className='muted';p.textContent=text('steps','{{count}} steps').replace('{{count}}',task.stepCount)+(task.progress?.tool?' · '+task.progress.tool:'');row.append(p);
    }
    if (task.progress?.message) { const p = document.createElement('p'); p.textContent = task.progress.message; row.append(p); }
    if (task.error) { const p = document.createElement('p'); p.className = 'error'; p.textContent = task.error; row.append(p); }
    const time = document.createElement('p'); time.className = 'muted'; time.textContent = new Date(task.createdAt).toLocaleString(board.locale); row.append(time);
    if (task.kind === 'bot' && task.result) {
      const details=document.createElement('details'), summary=document.createElement('summary'), output=document.createElement('p');
      summary.textContent=text('result','Result');output.className='task-result';output.textContent=task.result.kind==='attachment'?text('attachmentResult','Open conversation to view the attachment'):task.result.text;
      if(task.result.truncated)output.textContent+='\n'+text('resultTruncated','Open conversation for the full result');
      details.open=expanded.has(task.id);details.ontoggle=()=>{if(details.open)expanded.add(task.id);else expanded.delete(task.id);};details.append(summary,output);row.append(details);
    }
    const actions=document.createElement('div');actions.className='row';
    if (task.kind === 'bot') {
      const open=document.createElement('button');open.textContent=text('openConversation','Open conversation');
      open.onclick=async()=>{try{await board.tasks.open(task.id);}catch(e){error.hidden=false;error.textContent=e.message;}};actions.append(open);
    }
    if (active(task)) {
      const stop = document.createElement('button'); stop.textContent = text('stop', 'Stop'); stop.setAttribute('aria-label', text('stopTask', 'Stop {{title}}').replace('{{title}}', title(task)));
      stop.onclick = async () => { stop.disabled = true; try { await board.call('tasks.cancel', {id: task.id}); await load(); } catch (e) { error.hidden = false; error.textContent = e.message; stop.disabled = false; } };
      actions.append(stop);
    }
    row.append(actions);
    list.append(row);
  }
}
async function load() {
  if (busy) return;
  busy = true;
  try { tasks = (await board.call('tasks.list')).tasks; error.hidden = true; render(); }
  catch { error.hidden = false; error.textContent = text('unavailable', 'Unable to refresh'); }
  finally { busy = false; }
}
document.getElementById('active').onclick = () => { history = false; render(); };
document.getElementById('recent').onclick = () => { history = true; render(); };
scope.onchange = render;
load(); setInterval(load, 3000);
</script>
<style>.task{padding:16px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.task p{margin:6px 0;font-size:.88rem}.task strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.task-toolbar{gap:6px}.task-toolbar select{min-width:0;max-width:100%;flex:1;padding-inline:6px;font-size:13px}.task-result{white-space:pre-wrap}.task details{margin:10px 0}.task summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--accent)}.task .row{margin-top:10px}</style>
