<form class="stack">
<label><span id="prompt-label"></span><textarea id="prompt" required maxlength="12000" rows="2"></textarea></label>
<label><span id="thread-label"></span><select id="thread" required></select></label>
<div class="row"><label><span id="time-label"></span><input type="datetime-local" id="time" required></label><label><span id="repeat-label"></span><select id="repeat"><option value="0"></option><option value="3600"></option><option value="86400"></option></select></label></div>
<button id="add" type="submit"></button>
</form><p id="error" class="error" role="alert"></p><div id="jobs"></div>
<script>
const error = document.getElementById('error'), thread = document.getElementById('thread'), jobs = document.getElementById('jobs');
for (const [id, zh, en] of [['prompt-label','交给 Bot 的任务','Task for Bot'],['thread-label','目标会话','Conversation'],['time-label','执行时间（本地）','Run at (local time)'],['repeat-label','重复间隔','Repeat interval'],['add','创建定时任务','Schedule task']]) document.getElementById(id).textContent = board.t(zh,en);
for (const [i, zh, en] of [[0,'一次','Once'],[1,'每小时','Every hour'],[2,'每 24 小时','Every 24 hours']]) document.getElementById('repeat').options[i].textContent = board.t(zh,en);
const next = new Date(Date.now() + 3600000); next.setMinutes(next.getMinutes() - next.getTimezoneOffset()); document.getElementById('time').value = next.toISOString().slice(0,16);
let snapshot, busy = false;
async function load() {
  if (busy) return;
  try {
    const [state, conversations] = await Promise.all([board.read('schedules'), board.call('schedules.threads')]); snapshot = state;
    const selected = thread.value; thread.replaceChildren();
    for (const item of conversations.threads) { const option = document.createElement('option'); option.value = item.id; option.textContent = item.title || item.id; thread.append(option); }
    if ([...thread.options].some(o => o.value === selected)) thread.value = selected;
    if (!thread.options.length) { const option = document.createElement('option'); option.value = ''; option.textContent = board.t('请先创建一个 Bot 会话', 'Create a Bot conversation first'); thread.append(option); }
    render();
  } catch (e) { error.textContent = e.message; }
}
function render() {
  jobs.replaceChildren();
  if (!snapshot.data.jobs.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = board.t('暂无定时任务', 'No scheduled tasks'); jobs.append(p); }
  for (const job of snapshot.data.jobs) {
    const row = document.createElement('article'); row.className = 'job';
    const title = document.createElement('strong'); title.textContent = job.prompt;
    const detail = document.createElement('p'); detail.className = 'muted'; detail.textContent = job.enabled ? board.t('下次执行：', 'Next run: ') + new Date(job.nextRunAt).toLocaleString(board.locale) : job.lastMessageId && !job.everySeconds ? board.t('一次性调度已结束', 'One-shot dispatched') : board.t('调度已停用', 'Schedule disabled');
    row.append(title, detail);
    if (job.lastRunAt) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = board.t('最近投递：', 'Last dispatched: ') + new Date(job.lastRunAt).toLocaleString(board.locale); row.append(p); }
    if (job.lastTask) {
      const p=document.createElement('p');p.className=job.lastTask.status==='failed'?'error':'muted';
      p.textContent=board.t('最近任务：','Latest task: ')+(board.labels.status[job.lastTask.status]||job.lastTask.status);
      if(job.lastTask.completedAt)p.textContent+=' · '+new Date(job.lastTask.completedAt).toLocaleString(board.locale);
      if(job.lastTask.error)p.textContent+=' · '+job.lastTask.error;row.append(p);
    } else if(job.lastMessageId) { const p=document.createElement('p');p.className='muted';p.textContent=board.t('已投递，执行状态待同步','Dispatched; execution status pending');row.append(p); }
    if (job.error) { const p = document.createElement('p'); p.className = 'error'; p.textContent = job.error; row.append(p); }
    const toggle = document.createElement('button'); toggle.textContent = job.enabled ? board.t('停用', 'Disable') : board.t('启用', 'Enable');
    toggle.onclick = () => save(snapshot.data.jobs.map(j => j.id === job.id ? {...j, enabled: !j.enabled, ...(!j.enabled && Date.parse(j.nextRunAt) <= Date.now() ? {nextRunAt: new Date(Date.now() + 60000).toISOString()} : {})} : j));
    row.append(toggle); jobs.append(row);
  }
}
async function save(rows) {
  if (busy) return;
  busy = true; document.getElementById('add').disabled = true;
  try { snapshot = await board.write({jobs: rows}, snapshot, 'schedules'); error.textContent = ''; render(); return true; }
  catch (e) { error.textContent = e.message; }
  finally { busy = false; document.getElementById('add').disabled = false; await load(); }
}
document.querySelector('form').onsubmit = async event => {
  event.preventDefault(); if (!snapshot || busy) return;
  const at = new Date(document.getElementById('time').value), prompt = document.getElementById('prompt');
  if (!Number.isFinite(at.getTime()) || at.getTime() <= Date.now() || !prompt.value.trim()) { error.textContent = board.t('请填写任务并选择未来时间。', 'Enter a task and choose a future time.'); return; }
  const seconds = Number(document.getElementById('repeat').value);
  if (await save([...snapshot.data.jobs, {id: crypto.randomUUID(), prompt: prompt.value.trim(), threadId: thread.value, nextRunAt: at.toISOString(), ...(seconds ? {everySeconds: seconds} : {}), enabled: true}])) prompt.value = '';
};
load(); setInterval(load, 5000);
</script>
<style>label{display:grid;gap:5px;min-width:0;flex:1}textarea,select,input{width:100%;box-sizing:border-box}.job{padding:14px 0;border-top:1px solid var(--border);overflow-wrap:anywhere}.job p{font-size:.85rem}</style>
